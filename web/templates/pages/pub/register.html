{{define "content"}}
<div class="auth-page" style="min-height:calc(100vh - 64px)">
  <div class="auth-card">
    <div class="slogan">但行前路,不负韶华!</div>
    <h2>注册账号</h2>
    <div class="sub">注册即自动开通商户号,立即开始收款</div>
    {{if .Error}}<div class="alert err">{{.Error}}</div>{{end}}
    <form method="post" action="/register">
      <div class="form-item">
        <input class="input" type="text" name="username" placeholder="请输入用户名(3-20位字母数字下划线)" required value="{{index .Form "username"}}">
      </div>
      <div class="form-item">
        <input class="input" type="email" name="email" placeholder="请输入邮箱" value="{{index .Form "email"}}">
      </div>
      <div class="form-item">
        <input class="input" type="password" name="password" placeholder="请输入密码(至少6位)" required>
      </div>
      <div class="form-item">
        <input class="input" type="password" name="password2" placeholder="请输入确认密码" required>
      </div>
      <div class="form-item">
        <input class="input" type="text" name="qq" placeholder="请输入QQ号码(选填)" value="{{index .Form "qq"}}">
      </div>
      <div class="form-item">
        <input class="input" type="text" name="invite_code" placeholder="请输入邀请码,可空">
      </div>
      <div class="auth-agree">
        <input type="checkbox" name="agree" value="1" required id="agreeCk">
        <label for="agreeCk">我已阅读并同意 <a href="#" onclick="alert('注册即代表同意本平台服务条款:仅用于合法合规的收款场景,严禁用于违法违规交易。');return false">《服务条款》</a>与<a href="#" onclick="alert('本平台仅记录交易流水,不收集任何无关个人信息。');return false">《隐私条款》</a></label>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:12px" type="submit">立即注册</button>
    </form>
    <div class="auth-foot">
      已有账号? <a href="/login">立即登录</a>
      <span style="margin:0 8px;color:var(--border)">|</span>
      <a href="/">返回首页</a>
    </div>
  </div>
</div>
{{end}}
