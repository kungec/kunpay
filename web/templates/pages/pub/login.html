{{define "content"}}
<div class="auth-page" style="min-height:calc(100vh - 64px)">
  <div class="auth-card">
    <div class="slogan">但行前路,不负韶华!</div>
    <img src="/static/img/logo-icon@256.png" alt="KunPay" style="width:64px;height:64px;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 10px rgba(27,42,74,.2))">
    <h2>登录{{index .Settings "site_name"}}</h2>
    <div class="sub">欢迎回来,请登录您的商户账号</div>
    {{if .Error}}<div class="alert err">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="form-item">
        <input class="input" type="text" name="username" placeholder="请输入用户名" required value="{{if .Form}}{{.Form.username}}{{end}}">
      </div>
      <div class="form-item">
        <input class="input" type="password" name="password" placeholder="请输入密码" required>
      </div>
            <div class="form-item">
        <label>验证码</label>
        <div class="row" style="gap:8px;flex-wrap:nowrap">
          <input type="hidden" name="captcha_id" value="{{.CaptchaID}}">
          <input class="input" type="text" name="captcha_code" placeholder="输入图中字符" required style="flex:1;min-width:120px">
          <img src="/captcha/image?id={{.CaptchaID}}" class="captcha-img" alt="验证码" title="点击刷新" onclick="this.src='/captcha/image?id={{.CaptchaID}}&t='+Date.now()">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:12px" type="submit">登 录</button>
    </form>
    <div class="auth-foot">
      还没有账号? <a href="/register">立即注册</a>
      <span style="margin:0 8px;color:var(--border)">|</span>
      <a href="/forgot">忘记密码</a>
      <span style="margin:0 8px;color:var(--border)">|</span>
      <a href="/">返回首页</a>
    </div>
  </div>
</div>
{{end}}
