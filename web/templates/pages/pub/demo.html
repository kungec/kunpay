{{define "content"}}
<div class="demo-wrap">
  <div class="card" style="padding:34px">
    <div style="text-align:center;margin-bottom:24px">
      <div class="logo" style="justify-content:center;font-size:22px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
        {{index .Settings "site_name"}}
      </div>
      <p class="muted" style="margin-top:8px">支付体验测试 —— 输入金额,选择支付方式,体验完整支付流程</p>
    </div>
    <div class="form-item">
      <label>订单号</label>
      <input class="input" type="text" value="{{.DemoTradeNo}}" disabled>
    </div>
    <div class="form-item">
      <label>金额(元)</label>
      <div class="row">
        <span style="color:var(--text-3);font-size:16px">¥</span>
        <input class="input" id="demoMoney" type="number" step="0.01" min="0.01" value="1.00" style="font-size:16px">
      </div>
    </div>
    <div class="form-item">
      <label>支付方式</label>
      <div class="pay-type-row">
        {{range .Channels}}
        {{if eq .Type "alipay"}}
        <div class="pay-type alipay on" data-t="alipay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 14.6c-.9.4-2 .8-3.1 1.2.6-1.4 1-3 1.2-4.5h-4.1V9.9h5V8.8h-5V6.3h-2.4v2.5H7.9v1.1h5.1v1.4H8.9v1.1h8.2c-.2 1-.6 2-1 2.9-2.3.7-4.8 1.2-6.4 1.2-2.3 0-3.7-1.2-3.7-3 0-2 1.9-3.4 4.7-3.4.5 0 1 .03 1.6.1V4.5H4.9A1.9 1.9 0 0 0 3 6.4v11.2A1.9 1.9 0 0 0 4.9 19.5h14.2a1.9 1.9 0 0 0 1.9-1.9v-3zm-11.6 1.6c-1.4 0-2.3-.7-2.3-1.7 0-1.1 1-1.9 2.6-1.9.9 0 1.9.2 2.9.5-.4 1.9-1.7 3.1-3.2 3.1z"/></svg>支付宝</div>
        {{else if eq .Type "wxpay"}}
        <div class="pay-type wxpay" data-t="wxpay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 4C4.9 4 2 6.6 2 9.7c0 1.8 1 3.4 2.5 4.4l-.6 2 2.2-1.1c.7.2 1.4.3 2.2.3h.5a5.3 5.3 0 0 1-.2-1.5c0-3 2.9-5.4 6.4-5.4h.4C14.8 6 12 4 8.7 4zM6.6 7.5a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm4.6 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zM22 14c0-2.6-2.6-4.7-5.7-4.7S10.6 11.4 10.6 14s2.6 4.7 5.7 4.7c.6 0 1.3-.1 1.9-.3l1.9 1-.5-1.8A4.6 4.6 0 0 0 22 14zm-7.5-1.4a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm3.7 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6z"/></svg>微信</div>
        {{else}}
        <div class="pay-type qqpay" data-t="qqpay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.2 2 5.6 4.6 5.6 8.4c0 .6-.2 1.2-.5 1.8-.7 1.4-1.6 3-1.6 4.5 0 .7.4 1.2 1 1.2.5 0 .9-.3 1.3-.9l.6-1c.3.6.7 1.2 1.2 1.7-.9.3-1.5.8-1.5 1.4 0 1 1.7 1.6 3.4 1.8v.9c0 .5.7.9 1.5.9s1.5-.4 1.5-.9v-.9c1.7-.2 3.4-.8 3.4-1.8 0-.6-.6-1.1-1.5-1.4.5-.5.9-1.1 1.2-1.7l.6 1c.4.6.8.9 1.3.9.6 0 1-.5 1-1.2 0-1.5-.9-3.1-1.6-4.5-.3-.6-.5-1.2-.5-1.8C18.4 4.6 15.8 2 12 2z"/></svg>QQ钱包</div>
        {{end}}
        {{end}}
      </div>
    </div>
    <button class="btn btn-primary" id="demoPayBtn" style="width:100%;padding:13px;font-size:15px">立即支付</button>
    <p class="muted" style="margin-top:14px;font-size:12.5px;text-align:center">演示使用平台内置测试商户,下单后进入收银台扫码体验完整支付流程</p>
  </div>
</div>
{{end}}
