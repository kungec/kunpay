services:
  kunpay:
    build: .
    container_name: kunpay
    restart: always
    # DB 显式落数据卷,容器重建不丢数据
    command: ["-port", "8080", "-db", "/app/data/kunpay.db", "-data", "/app/data"]
    ports:
      - "8080:8080"
    volumes:
      - kunpay_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kunpay_data:
