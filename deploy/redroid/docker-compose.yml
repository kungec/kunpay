# KunPay 自建安卓云手机集群(3 台示例,可自行增减)
# 启动: docker compose up -d
# 初始化: ./init-monitor.sh 15555 "http://平台地址" "TokenA"  (端口依次 15556/15557)
# 说明: 320x640 小屏 + 软件渲染,与 KunPay Monitor 自动化配置坐标匹配,资源占用最低
# x86 服务器跑微信/支付宝请将 image 换为带 houdini/ndk 转译的镜像(见教程 3.2)

services:
  cloud1:
    image: redroid/redroid:13.0.0-latest
    container_name: kunpay-cloud1
    privileged: true
    volumes:
      - /data/kunpay-cloud1:/data
    ports:
      - "15555:5555"
    command: androidboot.redroid_width=320 androidboot.redroid_height=640 androidboot.redroid_dpi=160 androidboot.redroid_gpu_mode=guest
    restart: always

  cloud2:
    image: redroid/redroid:13.0.0-latest
    container_name: kunpay-cloud2
    privileged: true
    volumes:
      - /data/kunpay-cloud2:/data
    ports:
      - "15556:5555"
    command: androidboot.redroid_width=320 androidboot.redroid_height=640 androidboot.redroid_dpi=160 androidboot.redroid_gpu_mode=guest
    restart: always

  cloud3:
    image: redroid/redroid:13.0.0-latest
    container_name: kunpay-cloud3
    privileged: true
    volumes:
      - /data/kunpay-cloud3:/data
    ports:
      - "15557:5555"
    command: androidboot.redroid_width=320 androidboot.redroid_height=640 androidboot.redroid_dpi=160 androidboot.redroid_gpu_mode=guest
    restart: always
