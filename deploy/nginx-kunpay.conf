# KunPay Nginx 反向代理配置示例
# 用法: 替换 pay.example.com 为你的域名,证书路径为你的证书, reload nginx 即可
server {
    listen 80;
    server_name pay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pay.example.com;

    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 平台主体
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源可由 Nginx 直接缓存(可选)
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        expires 1h;
        add_header Cache-Control "public";
    }
}
