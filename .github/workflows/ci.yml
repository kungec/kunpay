name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: go vet
        run: go vet ./...
      - name: build 平台主程序
        run: go build -o kunpay ./cmd/server
      - name: build 监控助手
        run: go build -o kunpay-monitor ./cmd/monitor-desktop
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kunpay-linux-amd64
          path: kunpay

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 构建工具
        run: |
          mkdir -p $HOME/.android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d $HOME/.android-sdk/cmdline-tools
          mv $HOME/.android-sdk/cmdline-tools/cmdline-tools $HOME/.android-sdk/cmdline-tools/latest
          yes | $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk --licenses > /dev/null
          $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: 构建 APK
        working-directory: monitor-android
        run: bash build-android.sh
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: KunPayMonitor.apk
          path: monitor-android/KunPayMonitor.apk
