name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: 安装 Android SDK 构建工具
        run: |
          mkdir -p $HOME/.android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d $HOME/.android-sdk/cmdline-tools
          mv $HOME/.android-sdk/cmdline-tools/cmdline-tools $HOME/.android-sdk/cmdline-tools/latest
          yes | $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk --licenses > /dev/null
          $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: 构建平台主程序(6 平台)
        run: bash build.sh
      - name: 构建监控助手(6 平台)
        run: bash build-monitor.sh
      - name: 构建 Android 监控 APK
        working-directory: monitor-android
        run: bash build-android.sh
      - name: 打包(全部产物含监控助手)
        run: |
          mkdir -p release
          # 主程序分平台
          cd dist
          for d in kunpay_*/; do
            name="${d%/}"
            case "$name" in
              *windows*) (cd "$name" && zip -qr "../${name}.zip" .) ;;
              *) tar -czf "../${name}.tar.gz" "$name" ;;
            esac
          done
          cd ..
          cp dist/kunpay_*.tar.gz dist/kunpay_*.zip release/ 2>/dev/null || true
          # 监控助手分平台
          for f in dist/monitor/KunPayMonitor_win64.exe dist/monitor/KunPayMonitor_win_arm64.exe \
                   dist/monitor/KunPayMonitor_mac dist/monitor/KunPayMonitor_mac_intel; do
            [ -f "$f" ] && cp "$f" release/
          done
          [ -f dist/monitor/KunPayMonitor.app ] && zip -qr release/KunPayMonitor_mac.app.zip dist/monitor/KunPayMonitor.app || true
          # 安卓APK
          cp monitor-android/KunPayMonitor.apk release/
          # 全量包
          zip -qr kunpay-${{ github.ref_name }}-all.zip release/
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/kunpay_*.tar.gz
            release/kunpay_*.zip
            release/KunPayMonitor.apk
            release/KunPayMonitor_win64.exe
            release/KunPayMonitor_win_arm64.exe
            release/KunPayMonitor_mac
            release/KunPayMonitor_mac_intel
            release/KunPayMonitor_mac.app.zip
            kunpay-${{ github.ref_name }}-all.zip
