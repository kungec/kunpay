name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 构建工具
        run: |
          mkdir -p $HOME/.android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d $HOME/.android-sdk/cmdline-tools
          mv $HOME/.android-sdk/cmdline-tools/cmdline-tools $HOME/.android-sdk/cmdline-tools/latest
          yes | $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk --licenses > /dev/null
          $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.android-sdk "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: 构建平台主程序(6 平台)
        run: bash build.sh
      - name: 构建监控助手(6 平台)
        run: bash build-monitor.sh
      - name: 构建 Android 监控 APK
        working-directory: monitor-android
        run: bash build-android.sh
      - name: 打包(与 README 下载表一致的分平台归档)
        run: |
          mkdir -p release
          cd dist
          for d in kunpay_*/; do
            name="${d%/}"
            case "$name" in
              *windows*) (cd "$name" && zip -qr "../${name}.zip" .) ;;
              *) tar -czf "../${name}.tar.gz" "$name" ;;
            esac
          done
          cd ..
          cp dist/kunpay_*.tar.gz dist/kunpay_*.zip release/
          cp monitor-android/KunPayMonitor.apk release/
          zip -qr kunpay-${{ github.ref_name }}-all.zip release/
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/kunpay_*.tar.gz
            release/kunpay_*.zip
            release/KunPayMonitor.apk
            kunpay-${{ github.ref_name }}-all.zip
